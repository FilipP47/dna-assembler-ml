text: |
  load_training_csv odrzuca wiersze z context_seq krotszym niz min_context_len (domyslnie 10) albo z najdluzsza galezia krotsza niz min_branch_len (domyslnie 5). Przy only_labeled=True odrzuca tez wiersze z ground_truth = ambiguous albo NA. Gornej granicy dlugosci nie ma: dluzsze sekwencje sa obcinane w JunctionDataset. Kontekst zachowuje ostatnie context_len baz, czyli bazy tuz przed junctionem, takze w wariancie RC augmentacji. Galaz zachowuje pierwsze branch_len baz, czyli bazy tuz za junctionem.
