text: |
  load_training_csv odrzuca wiersze z context_seq krotszym niz min_context_len (domyslnie 10) albo z najdluzsza galezia krotsza niz min_branch_len (domyslnie 5). Przy only_labeled=True odrzuca tez wiersze z ground_truth = ambiguous albo NA. Gornej granicy dlugosci nie ma: dluzsze sekwencje sa obcinane do context_len i branch_len przy kodowaniu one-hot w JunctionDataset.
