text: |
  main.py train przyjmuje --lr_schedule {constant,cosine,plateau} (domyslnie plateau) i --warmup_epochs (int, domyslnie 0); --epochs dziala do co najmniej 200 (domyslnie nadal 50, bez gornego limitu). plateau to ReduceLROnPlateau na val junction_accuracy (patience 5, factor 0,5), cosine to lr * 0,5 * (1 + cos(pi * t / T)) z T = epochs - warmup_epochs, constant to stale --lr. Warm-up podnosi lr liniowo (lr * epoka / warmup_epochs); w jego trakcie ReduceLROnPlateau nie jest krokowany. Przy wartosciach domyslnych trening daje te same wagi i te same lr w kazdej epoce co kod sprzed zmiany. --weight_decay (1e-4) i --dropout (0,3) istnialy wczesniej i nie zmieniaja wartosci domyslnych.
