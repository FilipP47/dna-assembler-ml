text: |
  Symulator losuje start kazdego odczytu z rozkladu jednostajnego na [0, dlugosc_genomu - read_length]. Odczyty maja stala dlugosc read_length, pochodza tylko z nici prostej i nie maja bledow sekwencjonowania (sa dokladnymi podciagami referencji). Liczba odczytow to ceil(dlugosc_genomu * coverage / read_length). Genom krotszy niz read_length konczy sie bledem.
