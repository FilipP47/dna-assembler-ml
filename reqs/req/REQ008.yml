  Przy `main.py train --no_cov` wektor cech pokrycia jest pusty (cov_feat_dim = 0), wiec model widzi tylko one-hot kontekstu i galezi, a cov_ratio_max i pokrycia nie sa wejsciem. repeat_len nie jest wejsciem modelu w zadnym trybie. `evaluate` nie ma tej flagi: odczytuje cov_feat_dim z model_hparams w checkpoincie.
