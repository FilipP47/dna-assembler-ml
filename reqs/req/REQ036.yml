text: |
  ml/analysis/error_analysis.py czyta pliki *_predictions.csv (pliki lub katalogi) i liczy dokladnosc modelu i baseline oraz roznice w pp w podziale na typ etykiety (Known/Ambiguous/NotFound; dla dwoch ostatnich tylko liczebnosc), liczbe galezi, repeat_len (< 21 i >= 21, prog z --repeat_threshold), pokrycie (cov_tie oraz przedzialy cov_ratio_max) i organizm. Skrzyzowania wszystkich organizmow sa laczone, wiec wynik ogolny jest srednia wazona n_junctions. Wynik trafia do --out_csv, a krotkie podsumowanie tekstowe do <out_csv bez .csv>_summary.txt i do logu.
