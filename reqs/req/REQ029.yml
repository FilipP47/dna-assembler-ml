text: |
  Wszystkie rekordy pliku referencyjnego sa sklejane w jedna sekwencje bez separatora (load_reference w src/main.rs). Dla genomow z kilkoma chromosomami lub plazmidami powstaja sztuczne k-mery na granicach rekordow, symulator moze losowac odczyty przechodzace przez te granice, a etykiety sa liczone na sklejonej sekwencji.
