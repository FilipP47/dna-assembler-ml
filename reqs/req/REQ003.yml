text: |
  Poprawna galaz jest wyznaczana przez wyszukanie kontekstu w referencji, na nici prostej i jako reverse complement. Wystapienia, po ktorych nastepuje zasada spoza dostepnych galezi, sa pomijane. Wynik ma trzy stany: Known (ground_truth = A/C/G/T, gt_ambiguous = false), gdy wszystkie wystapienia wskazuja te sama galaz; Ambiguous (ground_truth = ambiguous, gt_ambiguous = true), gdy wskazuja rozne galezie; NotFound (ground_truth = NA, gt_ambiguous = false), gdy kontekstu nie ma w referencji albo zadne wystapienie nie wskazuje dostepnej galezi.
