text: |
  main.py train przyjmuje --split_by {row,node_seq,genome} (domyslnie row). row to dotychczasowy stratyfikowany podzial po wierszach (REQ009), dajacy identyczny zbior train i val jak wczesniej. node_seq i genome to podzialy grupowe: wszystkie wiersze z tym samym node_seq, albo z tego samego pliku CSV (kolumna source_file dodawana przez loader), trafiaja w calosci do train albo do val. Grupy sa losowane z seedem --seed i przenoszone do val, az val ma co najmniej --val_split wierszy; co najmniej jedna grupa zostaje w train. Mniej niz dwie grupy to blad.
