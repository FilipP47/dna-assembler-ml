text: |
  Przy augment=True kazda para (poprawna, bledna galaz), czyli jedna na kazda bledna galaz junctionu, daje 4 probki: oryginal, zamiane pozycji, reverse complement i reverse complement z zamiana. Wariant RC odwraca kazda sekwencje (kontekst i obie galezie) osobno i zachowuje kolejnosc kontekst, potem galaz, wiec nie jest to widok junctionu z nici przeciwnej. train.py wlacza augmentacje tylko dla zbioru treningowego.
