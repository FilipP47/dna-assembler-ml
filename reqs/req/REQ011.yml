text: |
  baseline_max_coverage.py liczy trafnosc heurystyki max-coverage na tej samej populacji junctionow co evaluate, pod warunkiem tych samych progow dlugosci: MIN_CONTEXT_LEN i MIN_BRANCH_LEN w skrypcie sa rowne domyslnym min_context_len i min_branch_len loadera i `main.py evaluate` (10 i 5). Remis pokrycia jest rozstrzygany na rzecz pierwszej zasady w kolejnosci A, C, G, T. Dla 40 commitowanych wynikow A/B n_junctions modelu jest rowne usable baseline.
