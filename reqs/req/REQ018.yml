text: |
  Ponowny trening A farthest z seedem 42 w srodowisku z uv.lock, na GPU tej samej klasy co referencja (RTX 4090), daje srednia junction_accuracy wazona n_junctions na 10 genomach testowych w przedziale [70,98%; 72,98%], czyli 71,98% +/- 1 pp. Kryterium jest srednia wazona; zwykla srednia referencji to 72,59%. Procedura: experiments/hpc/README.md, sekcja "Odtworzenie wyniku A farthest (seed 42)". Odtworzenia na RTX 4090: joby 94577/94594 (71,57%) i 99133/107989 (71,58%). Dla innego modelu GPU kryterium nie jest gwarantowane: na RTX PRO 6000 (job 99076) uzyskano 73,27%, czyli +1,29 pp, bo limit 50 epok wiaze i wynik zalezy od momentu wyjscia z plateau. Wyniki per genom moga roznic sie o kilka pp i nie sa objete kryterium.
