text: |
  Ponowny trening A farthest z seedem 42 w srodowisku z uv.lock daje srednia junction_accuracy wazona n_junctions na 10 genomach testowych w przedziale [69,98%; 73,98%], czyli 71,98% +/- 2 pp. Kryterium jest srednia wazona; zwykla srednia referencji to 72,59%. Procedura: experiments/hpc/README.md, sekcja "Odtworzenie wyniku A farthest (seed 42)". Tolerancja wynika z obserwowanego rozrzutu: odchylenia wzgledem oryginalu (81587, trening h32) to +1,29 pp na h32 (99076 i 108011, oba przebiegi) i -0,4 pp na glasser (94577 i 99133), a rozrzut miedzy GPU przy tym samym kodzie to 1,69 pp (glasser 71,58%, h32 73,27%). Ograniczenie: n=4 przebiegi daja tylko 2 unikalne wyniki (h32 i glasser), wiec granica 2 pp jest oszacowaniem, a nie przedzialem ufnosci; zrodlo odchylenia +1,29 pp wzgledem oryginalu jest nieustalone (docs/RAPORT_transfer_A_B.md, sekcja 7.8). Wyniki per genom moga roznic sie o kilka pp i nie sa objete kryterium.
